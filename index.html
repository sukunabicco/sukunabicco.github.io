<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sukunabicco</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #666; --accent: #5B9FD4; --card: #f5f7fa;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121417; --fg: #ececec; --muted: #9aa0a6; --card: #1d2126; }
  }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
  }
  main { max-width: 640px; margin: 0 auto; padding: 48px 24px; }
  h1 { font-size: 1.6rem; }
  a { color: var(--accent); }
  .card {
    background: var(--card); border-radius: 12px; padding: 20px 24px; margin-top: 24px;
  }
  .card h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .muted { color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <h1>sukunabicco</h1>
  <p class="muted">Indie app developer.</p>
  <div class="card">
    <h2>🐟 Jishin Sensei</h2>
    <p>A daily quiz app that teaches earthquake safety in Japan — one question a day, taught by a legendary catfish.</p>
    <p><a href="/jishin-sensei/">Support &amp; info</a> · <a href="/jishin-sensei/privacy.html">Privacy policy</a></p>
  </div>
</main>
</body>
</html>
